name: cdt db deployment

on:
  workflow_dispatch:
    inputs:
      # environment:
      #   description: 'The environment to run (CDT, Stage, Americas, Europe, Asia)'
      #   required: true
      authToken:
        description: 'Authentication token for the API'
        required: true
        #default: ''


jobs:
  trigger-repo-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Repo infra Workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: Bearer ${{ secrets.db_token}}" \
          https://api.github.com/repos/Maersk-Global/fbm-infra-automation/dispatches \
          -d '{
                "event_type": "trigger-by-FbM-fulfillment-mwms-wms-db",
                "client_payload": {
                  "authToken": "${{ github.event.inputs.authToken }}"
                }
              }'
