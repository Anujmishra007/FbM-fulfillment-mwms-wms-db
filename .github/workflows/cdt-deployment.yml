name: cdt db script deployment

on:
  workflow_dispatch:
    inputs:
      # branchName:
      #   description: 'Branch name for deployment'
      #   required: true
      #   default: 'db-deployments'
      # env_name:
      #   description: 'Environment name for deployment'
      #   required: true
      #   default: 'cdt'
      authToken:
        description: 'Authentication token for the API'
        required: true
        #default: ''

jobs:
  call-api:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout  repo
        uses: actions/checkout@v2

      - name: Call Capella API
        run: |
          curl -X POST "https://bffp.maersk-digital.net/v2/platforms/fbm/environments/cdt/products/wms/configurations" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ github.event.inputs.authToken }}" \
          -d '{
            "region": "westeurope",
            "repositoryName": "fbm-infra-automation",
            "playbookPath": "db-deploy-cdt.yml",
            "inventoryPath": "inventories/cdt.yml",
            "branchName": "main",
            "debugFlag": true,
            "extraVars": {
              "ENV_CODE": "cdt",
              "ENV_TYPE": "cdt",
              "REGION": "westeurope",
              "GEOGRAPHY": "europe",
              "PRODUCT_CODE": "wms",
              "PLATFORM_CODE": "fbm",
              "HASHICORP_VAULT_URL": "https://vault.maersk-digital.net",
              "targets": "wmsdb1"
            }
          }'



