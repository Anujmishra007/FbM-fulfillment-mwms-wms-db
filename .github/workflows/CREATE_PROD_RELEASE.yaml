name: Create PROD RELEASE

on:
  workflow_dispatch:
    inputs:
      COMMENTS:
        description:
          "Please select the tag name for prod release and specify comments if you have any.
          If you do not have any comments, please leave it blank."
        required: true

permissions: write-all

env:
  GH_TOKEN: ${{ secrets.FBM_WMS_BRANCH_AUTOMATION_PAT }}
  OWNER: ${{ github.repository_owner }}
  REPO: ${{ github.event.repository.name }}
jobs:
  CREATE_PROD_RELEASE:
    runs-on: ubuntu-latest # windows-latest || macos-latest
    name: Create PROD Release tag
    steps:
      - name: checking PROD deployment conditions
        shell: pwsh
        run: |
          if('${{ github.ref }}' -like "refs/tags/*"){
            write-host "This is a tag or hotfix deployment"
           }else{
            write-output '# ERROR : Deployment was initiated using a branch(${{ github.ref_name }}) instead of a tag.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append
            write-output '```markdown' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append
            write-output '❌ **Error:**  PROD deployment can only be initiated using a tag and not directly from any branch. Please choose the appropriate tag for deployment.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append
            throw "tage deployment can only be initiated using a tag and not directly from any branch. Please choose the appropriate tag for deployment."
           }
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ env.GH_TOKEN }}

