      - name: Create branch with tag name -prod
        shell: pwsh
        run: |
          git checkout -b ${{ github.ref_name }}-prod ${{ github.ref }}
          git push origin ${{ github.ref_name }}-prod
          $pull_request = gh pr create --base release --head ${{ github.ref_name }}-prod --title "${{ github.ref_name }} is ready for production release" --body "This is an automated pull request to promote tag ${{ github.ref_name }} to main branch for production release. The the action is triggered by ${{ github.actor }}, Comments: ${{ github.event.inputs.COMMENTS }}."
          gh pr merge $pull_request  --merge --subject "This is an automated pull request to promote tag ${{ github.ref_name }} to main branch for production release  by ${{ github.actor }}" --admin

      - name: Prod Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{  github.ref_name }}-prod
          body_path: Release.txt
