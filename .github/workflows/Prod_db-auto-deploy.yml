                "targets": "wmsdb-a-utc"
                "country_list": "ALL",
                "script_files": "${{ env.changed_files}}"
              }
            }'

  
            echo "Deploying with the following payload: $payload"
  
            response=$(curl -s -X POST https://bffp.maersk-digital.net/v2/platforms/fbm/environments/europe/products/wms/configurations \
              -H "Authorization: Bearer $bearer_token" \
              -H "Content-Type: application/json" \
