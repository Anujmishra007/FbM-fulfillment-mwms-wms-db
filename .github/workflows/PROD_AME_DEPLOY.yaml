name: PROD AME DEPLOY

on:
  workflow_dispatch:
    inputs:
      TARGET_DBS:
        description: "Select target database(s) for deployment"
        required: true
        type: choice
        options:
          - ALL
          - ALL_EXCEPT_LEVIS
          - BRAWMS
          - CHLWMS
          - CHLV1WMS
          - USA4DWMS
          - USA4DNJWMS
          - CAN4DWMS
          - PANWMS
          - COLWMS
          - PERWMS
          - PERV1WMS
          - MEXWMS
          - MEX7DTIJWMS
          - USALEV4DWMS
      PR_NUMBERS:
        description: "PR number(s) to extract SQL files from - comma separated (e.g., 126 or 126,127)"
        required: false
        type: string
        default: ""
      SQL_FILES:
        description: "Direct SQL file paths - comma separated (e.g., WMS/StoredProc/x.sql). Use for ad-hoc sync without PR."
        required: false
        type: string
        default: ""
      SNOW_CR:
        description: "Please share the ServiceNow CR number for tracking"
        required: false
        type: string
        default: ""

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGION: AME
  ENVIRONMENT: PROD

jobs:
  INIT:
    runs-on: ubuntu-latest
    name: "Validate & Prepare Deployment"
    outputs:
      SQL_FILES_LIST: ${{ steps.prepare.outputs.SQL_FILES_LIST }}
      TARGET_SERVERS: ${{ steps.prepare.outputs.TARGET_SERVERS }}
      RUNNER: ${{ steps.prepare.outputs.RUNNER }}
      VALID: ${{ steps.prepare.outputs.VALID }}
    steps:
      - name: Validate branch
        if: github.ref != 'refs/heads/release'
        run: |
          echo "::error::This workflow can only be run from the 'release' branch."
          echo "Current branch: ${{ github.ref }}"
          exit 1

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Validate inputs
        shell: bash
        run: |
          if [[ -z "${{ inputs.PR_NUMBERS }}" && -z "${{ inputs.SQL_FILES }}" ]]; then
            echo "::error::Either PR_NUMBERS or SQL_FILES must be provided"
            exit 1
          fi

      - name: Extract SQL files from PRs
        id: extract_pr_files
        if: inputs.PR_NUMBERS != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBERS="${{ inputs.PR_NUMBERS }}"
          ALL_SQL_FILES=""
          UNMERGED_PRS=""
          INVALID_BASE_PRS=""

          echo "## PR Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| PR # | Title | Status | SQL Files |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|--------|-----------|" >> $GITHUB_STEP_SUMMARY

          IFS=',' read -ra PR_ARRAY <<< "$PR_NUMBERS"
          for PR in "${PR_ARRAY[@]}"; do
            PR=$(echo "$PR" | xargs)

            PR_DATA=$(gh pr view "$PR" --json title,state,mergedAt,baseRefName 2>/dev/null || echo "")

            if [[ -z "$PR_DATA" ]]; then
              echo "| $PR | - | ❌ Not found | - |" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            TITLE=$(echo "$PR_DATA" | jq -r '.title' | head -c 50)
            MERGED_AT=$(echo "$PR_DATA" | jq -r '.mergedAt')
            BASE_REF=$(echo "$PR_DATA" | jq -r '.baseRefName')

            if [[ "$MERGED_AT" == "null" || "$MERGED_AT" == "" ]]; then
              echo "| $PR | $TITLE | ⚠️ Not merged | - |" >> $GITHUB_STEP_SUMMARY
              UNMERGED_PRS="$UNMERGED_PRS $PR"
              continue
            fi

            if [[ "$BASE_REF" != "release" ]]; then
              echo "| $PR | $TITLE | ⚠️ Merged to $BASE_REF | - |" >> $GITHUB_STEP_SUMMARY
              INVALID_BASE_PRS="$INVALID_BASE_PRS $PR"
              continue
            fi

            PR_FILES=$(gh pr view "$PR" --json files --jq '.files[].path' | grep '\.sql$' || echo "")
            FILE_COUNT=$(echo "$PR_FILES" | grep -c '\.sql$' 2>/dev/null || echo "0")

            if [[ -n "$PR_FILES" ]]; then
              ALL_SQL_FILES="$ALL_SQL_FILES $PR_FILES"
            fi

            echo "| $PR | $TITLE | ✅ Merged to release | $FILE_COUNT files |" >> $GITHUB_STEP_SUMMARY
          done

          if [[ -n "$UNMERGED_PRS" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Deployment Blocked" >> $GITHUB_STEP_SUMMARY
            echo "The following PRs are not merged:$UNMERGED_PRS" >> $GITHUB_STEP_SUMMARY
            echo "::error::PRs not merged to release:$UNMERGED_PRS"
            exit 1
          fi

          if [[ -n "$INVALID_BASE_PRS" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Warning" >> $GITHUB_STEP_SUMMARY
            echo "The following PRs were not merged to \`release\` branch:$INVALID_BASE_PRS" >> $GITHUB_STEP_SUMMARY
          fi

          UNIQUE_FILES=$(echo "$ALL_SQL_FILES" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          echo "PR_SQL_FILES=$UNIQUE_FILES" >> $GITHUB_OUTPUT

      - name: Prepare deployment
        id: prepare
        shell: bash
        run: |
          PR_FILES="${{ steps.extract_pr_files.outputs.PR_SQL_FILES }}"
          DIRECT_FILES="${{ inputs.SQL_FILES }}"

          if [[ -n "$PR_FILES" && -n "$DIRECT_FILES" ]]; then
            ALL_FILES="$PR_FILES,$DIRECT_FILES"
          elif [[ -n "$PR_FILES" ]]; then
            ALL_FILES="$PR_FILES"
          else
            ALL_FILES="$DIRECT_FILES"
          fi

          UNIQUE_FILES=$(echo "$ALL_FILES" | tr ',' '\n' | sort -u | grep -v '^$' | tr '\n' ',' | sed 's/,$//')

          CONFIG=$(cat .github/config/db-servers.json)
          RUNNER=$(echo "$CONFIG" | jq -r ".PROD.AME.runner")
          SERVERS=$(echo "$CONFIG" | jq -c ".PROD.AME.servers")
          LEVIS_DB=$(echo "$CONFIG" | jq -r ".PROD.AME.levis_db")

          TARGET_DBS="${{ inputs.TARGET_DBS }}"

          if [[ "$TARGET_DBS" == "ALL" ]]; then
            TARGET_SERVERS="$SERVERS"
          elif [[ "$TARGET_DBS" == "ALL_EXCEPT_LEVIS" ]]; then
            # Remove Levis DB from servers
            TARGET_SERVERS=$(echo "$SERVERS" | jq --arg levis "$LEVIS_DB" '
              to_entries | map(
                .value = (.value | map(select(. != $levis)))
              ) | map(select(.value | length > 0)) | from_entries
            ')
          else
            # Single DB selection
            TARGET_SERVERS="{}"
            DB="$TARGET_DBS"
            SERVER=$(echo "$SERVERS" | jq -r "to_entries[] | select(.value | contains([\"$DB\"])) | .key")
            if [[ -n "$SERVER" ]]; then
              TARGET_SERVERS=$(echo "{}" | jq --arg server "$SERVER" --arg db "$DB" '.[$server] = [$db]')
            else
              echo "::error::Database $DB not found in AME config"
              exit 1
            fi
          fi

          # Validate SQL files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## SQL Files to Deploy (from release branch)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | File Path | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          VALID="true"
          COUNT=1
          IFS=',' read -ra FILE_ARRAY <<< "$UNIQUE_FILES"
          for FILE in "${FILE_ARRAY[@]}"; do
            FILE=$(echo "$FILE" | xargs)
            if [[ -f "$FILE" ]]; then
              echo "| $COUNT | \`$FILE\` | ✅ Found |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $COUNT | \`$FILE\` | ❌ Not found in release |" >> $GITHUB_STEP_SUMMARY
              VALID="false"
            fi
            ((COUNT++))
          done

          # Target summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Target" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: PROD" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: AME (Americas)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: $TARGET_DBS" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: \`$RUNNER\`" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${{ inputs.SNOW_CR }}" ]]; then
            echo "- **ServiceNow CR**: ${{ inputs.SNOW_CR }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Server → Database Mapping" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$TARGET_SERVERS" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [[ "$VALID" == "false" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Deployment Blocked" >> $GITHUB_STEP_SUMMARY
            echo "Some SQL files were not found in the \`release\` branch." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### ⏳ Awaiting Approval" >> $GITHUB_STEP_SUMMARY
          echo "Review the files and targets above, then approve to proceed with deployment." >> $GITHUB_STEP_SUMMARY

          echo "SQL_FILES_LIST=$UNIQUE_FILES" >> $GITHUB_OUTPUT
          echo "TARGET_SERVERS=$TARGET_SERVERS" >> $GITHUB_OUTPUT
          echo "RUNNER=$RUNNER" >> $GITHUB_OUTPUT
          echo "VALID=$VALID" >> $GITHUB_OUTPUT

  APPROVAL:
    runs-on: ubuntu-latest
    needs: [INIT]
    if: needs.INIT.outputs.VALID == 'true'
    environment:
      name: PROD-AMERICAS
    name: "Approve Deployment"
    steps:
      - name: Approved
        run: echo "✅ Deployment approved by ${{ github.actor }}"

  DEPLOY:
    runs-on: ${{ needs.INIT.outputs.RUNNER }}
    needs: [INIT, APPROVAL]
    if: needs.INIT.outputs.VALID == 'true'
    name: "Execute Deployment"
    env:
      SQL_FILES_LIST: ${{ needs.INIT.outputs.SQL_FILES_LIST }}
      TARGET_SERVERS: ${{ needs.INIT.outputs.TARGET_SERVERS }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Install PowerShell
        uses: PSModule/install-powershell@v1

      - name: Install SqlServer module
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module SqlServer -Force
          }

      - name: Execute SQL Deployment
        id: deploy
        shell: pwsh
        env:
          DB_USERNAME: ${{ secrets.PROD_DB_ADMIN_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_ADMIN_USER_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"

          $sqlFilesList = "$env:SQL_FILES_LIST" -split ","
          $targetServers = $env:TARGET_SERVERS | ConvertFrom-Json
          $username = $env:DB_USERNAME
          $password = $env:DB_PASSWORD

          $results = @()
          $hasErrors = $false
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'

          New-Item -ItemType Directory -Path "./logs" -Force | Out-Null
          $logFile = "./logs/deployment_$timestamp.txt"

          Write-Host "=========================================="
          Write-Host "   PROD AME DEPLOYMENT STARTED"
          Write-Host "=========================================="
          Write-Host "Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "Files to deploy: $($sqlFilesList.Count)"
          Write-Host "Target: ${{ inputs.TARGET_DBS }}"
          Write-Host "=========================================="

          foreach ($server in $targetServers.PSObject.Properties) {
            $serverName = $server.Name
            $databases = $server.Value

            foreach ($database in $databases) {
              Write-Host ""
              Write-Host ">>> Processing: $database on $serverName"
              Write-Host "-------------------------------------------"

              foreach ($sqlFile in $sqlFilesList) {
                $sqlFile = $sqlFile.Trim()
                if ([string]::IsNullOrEmpty($sqlFile)) { continue }

                $result = [PSCustomObject]@{
                  Server = $serverName
                  Database = $database
                  File = $sqlFile
                  Status = "Pending"
                  Duration = 0
                  Error = ""
                }

                if (-Not (Test-Path $sqlFile)) {
                  $result.Status = "NotFound"
                  $result.Error = "File not found"
                  $results += $result
                  Write-Host "  ❌ $sqlFile - NOT FOUND" -ForegroundColor Red
                  Add-Content -Path $logFile -Value "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | NOT FOUND | $sqlFile"
                  $hasErrors = $true
                  continue
                }

                $startTime = Get-Date
                $fileName = Split-Path $sqlFile -Leaf

                try {
                  $connectionString = "Server=$serverName;Database=$database;User Id=$username;Password=$password;TrustServerCertificate=True;"
                  Invoke-Sqlcmd -InputFile $sqlFile -ConnectionString $connectionString -ErrorAction Stop

                  $duration = [math]::Round(((Get-Date) - $startTime).TotalSeconds, 2)
                  $result.Status = "Success"
                  $result.Duration = $duration

                  Write-Host "  ✅ $fileName - SUCCESS (${duration}s)" -ForegroundColor Green
                  Add-Content -Path $logFile -Value "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | SUCCESS | $serverName | $database | $sqlFile | ${duration}s"
                }
                catch {
                  $duration = [math]::Round(((Get-Date) - $startTime).TotalSeconds, 2)
                  $result.Status = "Failed"
                  $result.Duration = $duration
                  $result.Error = $_.Exception.Message
                  $hasErrors = $true

                  Write-Host "  ❌ $fileName - FAILED" -ForegroundColor Red
                  Write-Host "     Error: $($_.Exception.Message)" -ForegroundColor Red
                  Add-Content -Path $logFile -Value "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | FAILED | $serverName | $database | $sqlFile | $($_.Exception.Message)"
                }

                $results += $result
              }
            }
          }

          $successCount = ($results | Where-Object { $_.Status -eq "Success" }).Count
          $failedCount = ($results | Where-Object { $_.Status -eq "Failed" }).Count
          $notFoundCount = ($results | Where-Object { $_.Status -eq "NotFound" }).Count

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "   DEPLOYMENT SUMMARY"
          Write-Host "=========================================="
          Write-Host "Total Operations: $($results.Count)"
          Write-Host "✅ Successful: $successCount" -ForegroundColor Green
          Write-Host "❌ Failed: $failedCount" -ForegroundColor $(if ($failedCount -gt 0) { "Red" } else { "Green" })
          Write-Host "⚠️  Not Found: $notFoundCount" -ForegroundColor $(if ($notFoundCount -gt 0) { "Yellow" } else { "Green" })
          Write-Host "=========================================="

          # GitHub Step Summary
          $summaryFile = $env:GITHUB_STEP_SUMMARY

          Add-Content $summaryFile "## Deployment Results - PROD AME"
          Add-Content $summaryFile ""
          Add-Content $summaryFile "**Target**: ${{ inputs.TARGET_DBS }}"
          Add-Content $summaryFile ""
          Add-Content $summaryFile "| Server | Database | File | Status | Duration |"
          Add-Content $summaryFile "|--------|----------|------|--------|----------|"

          foreach ($r in $results) {
            $statusIcon = switch ($r.Status) {
              "Success" { "✅" }
              "Failed" { "❌" }
              "NotFound" { "⚠️" }
              default { "❓" }
            }
            $fileName = Split-Path $r.File -Leaf
            Add-Content $summaryFile "| $($r.Server) | $($r.Database) | \`\`$fileName\`\` | $statusIcon $($r.Status) | $($r.Duration)s |"
          }

          Add-Content $summaryFile ""
          Add-Content $summaryFile "### Summary"
          Add-Content $summaryFile "- ✅ Successful: $successCount"
          Add-Content $summaryFile "- ❌ Failed: $failedCount"
          Add-Content $summaryFile "- ⚠️ Not Found: $notFoundCount"

          if ($failedCount -gt 0) {
            Add-Content $summaryFile ""
            Add-Content $summaryFile "### Errors"
            Add-Content $summaryFile '```'
            foreach ($r in ($results | Where-Object { $_.Status -eq "Failed" })) {
              $fileName = Split-Path $r.File -Leaf
              Add-Content $summaryFile "[$($r.Database)] $fileName"
              Add-Content $summaryFile "  Error: $($r.Error)"
              Add-Content $summaryFile ""
            }
            Add-Content $summaryFile '```'
          }

          $results | ConvertTo-Json -Depth 3 | Out-File "./logs/results.json"

          if ($hasErrors) {
            Write-Host ""
            Write-Host "⚠️  Deployment completed with errors. Check logs for details." -ForegroundColor Yellow
            exit 1
          }

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-AME-${{ github.run_id }}
          path: ./logs/

      - name: Notify Teams - Success
        if: success()
        uses: Maersk-Global/fbm-github-actions/ms-teams-notification@v3
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.MWMS_V2_PROD_AME_TEAMS_HOOK }}
          notification-summary: "✅ PROD AME Deploy - ${{ inputs.TARGET_DBS }} - Success | CR: ${{ inputs.SNOW_CR }}"
          notification-color: 28A745

      - name: Notify Teams - Failure
        if: failure()
        uses: Maersk-Global/fbm-github-actions/ms-teams-notification@v3
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.MWMS_V2_PROD_AME_TEAMS_HOOK }}
          notification-summary: "❌ PROD AME Deploy - ${{ inputs.TARGET_DBS }} - Failed | CR: ${{ inputs.SNOW_CR }}"
          notification-color: DC3545
